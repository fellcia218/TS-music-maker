<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABC 谱面转译</title>
<style>
body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:900px;margin:0 auto;padding:24px;background:#faf9f7;color:#1c1a17;}
h1{font-size:20px;margin-bottom:6px;}
.tip{color:#6b6560;font-size:14px;margin:0 0 16px;}
textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.7;padding:12px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;background:#fff;resize:vertical;}
#paper{background:#fff;padding:24px;margin-top:20px;border:1px solid #e5e0d8;border-radius:6px;min-height:100px;overflow-x:auto;}
button{padding:8px 18px;margin-right:10px;margin-top:12px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;font-size:14px;}
button:hover{background:#f0ece6;}
</style>
</head>
<body>
<h1>ABC 记谱 → 五线谱</h1>
<p class="tip">左边写 ABC 文本，点渲染出谱，点播放听声。</p>
<textarea id="abc">X:1
T:示例
M:4/4
L:1/4
K:C
C D E F | G A B c | c B A G | F E D C |</textarea>
<div>
  <button onclick="render()">渲染</button>
  <button onclick="play()">播放</button>
</div>
<div id="paper"></div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6/dist/abcjs-basic-min.js"></script>
<script>
let visualObj = null;

function render(){
  const abc = document.getElementById('abc').value;
  visualObj = ABCJS.renderAbc('paper', abc, { responsive: 'resize' })[0];
}

async function play(){
  if(!visualObj) render();
  const synth = new ABCJS.synth.CreateSynth();
  await synth.init({
    visualObj: visualObj,
    audioContext: new (window.AudioContext || window.webkitAudioContext)(),
    options: { soundFontUrl: "https://paulrosen.github.io/midi-js-soundfonts/abcjs/" }
  });
  await synth.prime();
  synth.start();
}

render();
</script>
</body>
</html>
